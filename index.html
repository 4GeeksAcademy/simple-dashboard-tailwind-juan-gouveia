<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Panel de Control</title>
</head>

<body class="bg-pink-50">

    

        <nav class="relative w-full border-b border-pink-200 bg-white">
            <input id="menu-toggle" type="checkbox" class="peer hidden" />

            <div class="mx-auto flex h-12 items-center justify-between px-3 md:h-14 md:px-4 lg:h-16 lg:max-w-6xl lg:px-8">
                <span class="text-sm font-semibold text-pink-700 md:text-base lg:text-lg">Panel de Control</span>

                <label for="menu-toggle" class="cursor-pointer rounded p-2 hover:bg-pink-100 md:hidden">
                    <span class="sr-only">Abrir Menú</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-pink-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </label>

                <ul class="hidden md:flex md:items-center md:gap-1 lg:gap-3">
                    <li><button type="button" class="rounded px-3 py-2 text-sm text-pink-800 hover:bg-pink-100 md:text-sm lg:px-5 lg:text-base">KPI's</button></li>
                    <li><button type="button" class="rounded px-3 py-2 text-sm text-pink-800 hover:bg-pink-100 md:text-sm lg:px-5 lg:text-base">Drivers</button></li>
                    <li><button type="button" class="rounded px-3 py-2 text-sm text-pink-800 hover:bg-pink-100 md:text-sm lg:px-5 lg:text-base">Detalles</button></li>
                </ul>
            </div>

            <ul class="hidden border-t border-pink-200 bg-white peer-checked:block md:hidden">
                <li><button type="button" class="block w-full border-b border-pink-100 px-4 py-3 text-left text-sm text-pink-800 hover:bg-pink-100">KPI's</button></li>
                <li><button type="button" class="block w-full border-b border-pink-100 px-4 py-3 text-left text-sm text-pink-800 hover:bg-pink-100">Drivers</button></li>
                <li><button type="button" class="block w-full border-b border-pink-100 px-4 py-3 text-left text-sm text-pink-800 hover:bg-pink-100">Detalles</button></li>
            </ul>
        </nav>


</body>
</html>
